<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PregioShop – À votre élégance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#fdfdfd;
  --ink:#141210;
  --gold:#b8892f;
  --gold-light:#d9b265;
  --line:#e6dcc6;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--paper);color:var(--ink);font-family:var(--serif);
  min-height:100vh;
  padding:max(28px,env(safe-area-inset-top,0px)) 22px max(36px,env(safe-area-inset-bottom,0px));
}
main{max-width:440px;margin:0 auto;text-align:center}
.logo{width:min(280px,72%);height:auto;display:block;margin:0 auto 6px}
.rule{height:1px;border:0;margin:18px auto 26px;width:120px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:14px}
li{display:flex;gap:10px}
.link{
  flex:1;display:flex;align-items:center;gap:16px;text-align:left;text-decoration:none;color:var(--ink);
  padding:15px 20px;border:1px solid var(--line);border-left:3px solid var(--gold);background:#fff;
  transition:border-color .2s,background .2s;
}
.link:hover,.link:focus-visible{border-color:var(--gold);background:#fbf6ea}
.link svg{width:26px;height:26px;flex:none;stroke:var(--gold);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.t{display:block;font-size:23px;font-weight:600;line-height:1.1}
.s{display:block;font-size:16px;color:#6f6454;margin-top:2px;overflow-wrap:anywhere}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
footer{margin-top:34px;font-size:18px;font-style:italic;color:#6f6454}
@media (max-width:380px){.t{font-size:21px}}
</style>
</head>
